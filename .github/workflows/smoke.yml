name: PR release quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare
      - run: npm run typecheck
      - run: npm run storefront:typecheck
      - run: npm run backend:typecheck
      - run: npm run test:smoke
      - run: npm run test:keyboard
        env:
          CG_KEYBOARD_EVIDENCE_DIR: test-results/keyboard
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-evidence
          path: |
            playwright-report/
            test-results/
            .runtime/backend.log
            .runtime/storefront.log
          retention-days: 14
      - run: npm run aut:stop
        if: always()
      - run: docker compose down --volumes
        if: always()
