services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: commerceguard
      POSTGRES_PASSWORD: commerceguard_local
      POSTGRES_DB: commerceguard_test
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceguard -d commerceguard_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - commerceguard_pg:/var/lib/postgresql
volumes:
  commerceguard_pg:
